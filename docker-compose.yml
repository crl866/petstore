version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: petstore-postgres
    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./petstore-backend
      dockerfile: Dockerfile
    container_name: petstore-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/petstore
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      SPRING_PROFILE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: ./petstore-frontend
      dockerfile: Dockerfile
    container_name: petstore-frontend
    environment:
      VITE_API_BASE_URL: http://backend:8080
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: petstore-network
