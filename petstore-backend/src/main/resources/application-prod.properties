# Production configuration for Render
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${DATABASE_USER:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keep the app from falling back to localhost if Render has not injected DB env yet
spring.sql.init.mode=never
