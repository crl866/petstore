services:
  - type: web
    name: petstore-backend
    runtime: docker
    rootDir: petstore-backend
    dockerContext: petstore-backend
    dockerfilePath: petstore-backend/Dockerfile
    healthCheckPath: /david/api/v1/pets
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-postgres
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: petstore-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: petstore-postgres
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: static
    name: petstore-frontend
    rootDir: petstore-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com

databases:
  - name: petstore-postgres
    databaseName: petstore
    user: petstore